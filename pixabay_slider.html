<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixabay 이미지 슬라이더</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 1.5rem 1rem; background: #f3f4f6; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; text-align: center; }
  form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 0.6rem 1rem; font-size: 1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  #msg { text-align: center; color: #6b7280; min-height: 1.5rem; }
  .slider { position: relative; background: #111; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; display: none; }
  .slider img { width: 100%; height: 100%; object-fit: contain; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); font-size: 1.5rem; padding: 0.5rem 0.9rem; }
  #prev { left: 0.5rem; } #next { right: 0.5rem; }
  .info { text-align: center; margin: 0.6rem 0; color: #374151; }
  .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; opacity: .6; }
  .thumbs img.on { opacity: 1; outline: 3px solid #2563eb; }
  #more { display: none; margin: 1rem auto 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼️ Pixabay 이미지 슬라이더</h1>

  <form id="form">
    <div class="row"><input id="key" type="password" placeholder="Pixabay API Key" autocomplete="off"></div>
    <div class="row">
      <input id="q" placeholder="검색어 (예: 제주 감귤, tangerine)" required>
      <button>검색</button>
    </div>
  </form>

  <p id="msg"></p>

  <div class="slider" id="slider">
    <img id="photo" alt="">
    <button class="nav" id="prev" type="button">◀</button>
    <button class="nav" id="next" type="button">▶</button>
  </div>
  <p class="info" id="info"></p>
  <div class="thumbs" id="thumbs"></div>
  <button id="more" type="button">다음 10개 ▶▶</button>
</div>

<script>
  const $ = id => document.getElementById(id);
  let images = [], idx = 0, page = 1, query = "";

  function show(i) {
    idx = (i + images.length) % images.length;
    $("photo").src = images[idx].webformatURL;
    $("photo").alt = images[idx].tags;
    $("info").textContent = `${idx + 1} / ${images.length} · ${images[idx].tags} · by ${images[idx].user}`;
    [...$("thumbs").children].forEach((t, n) => t.classList.toggle("on", n === idx));
  }

  async function load() {
    const key = $("key").value.trim();
    $("msg").textContent = "불러오는 중...";
    try {
      const url = `https://pixabay.com/api/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(query)}`
                + `&image_type=photo&per_page=10&page=${page}&lang=ko`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 400 ? "API Key가 올바르지 않습니다." : `오류 ${res.status}`);
      const data = await res.json();
      if (!data.hits.length) {
        $("msg").textContent = page === 1 ? "검색 결과가 없습니다." : "더 이상 결과가 없습니다.";
        return;
      }
      images = data.hits;
      $("thumbs").innerHTML = "";
      images.forEach((img, n) => {
        const t = document.createElement("img");
        t.src = img.previewURL;
        t.alt = img.tags;
        t.onclick = () => show(n);
        $("thumbs").appendChild(t);
      });
      $("slider").style.display = "block";
      $("more").style.display = "block";
      $("msg").textContent = `"${query}" 검색 결과 ${page}페이지 (총 ${data.totalHits}개 중)`;
      show(0);
    } catch (e) {
      $("msg").textContent = e.message;
    }
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    if (!$("key").value.trim()) { $("msg").textContent = "API Key를 입력하세요."; return; }
    query = $("q").value.trim();
    page = 1;
    load();
  });
  $("prev").onclick = () => show(idx - 1);
  $("next").onclick = () => show(idx + 1);
  $("more").onclick = () => { page++; load(); };
  document.addEventListener("keydown", e => {
    if (!images.length || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
  });
</script>
</body>
</html>
