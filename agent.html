<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 특산물 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Malgun Gothic", sans-serif;
    background: #fff8ee;
  }
  header {
    background: #ff9f1c;
    color: #fff;
    text-align: center;
    padding: 0.9rem;
    font-weight: bold;
    font-size: 1.1rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .bubble {
    max-width: 75%;
    padding: 0.6rem 0.9rem;
    border-radius: 16px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .me { align-self: flex-end; background: #2f7d4f; color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #fff; color: #2d2a26; border: 1px solid #f0dcc0; border-bottom-left-radius: 4px; }
  form {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem;
    background: #fff;
    border-top: 1px solid #eadfcf;
  }
  input { flex: 1; padding: 0.7rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 999px; outline: none; }
  button { padding: 0.7rem 1.3rem; font-size: 1rem; border: 0; border-radius: 999px; background: #2f7d4f; color: #fff; cursor: pointer; }
  .note { text-align: center; font-size: 0.75rem; color: #9a8f82; padding: 0.3rem 0 0.5rem; background: #fff; }
</style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button>보내기</button>
  </form>
  <div class="note">※ AI(Gemini)가 만든 답변이라 틀릴 수 있어요.</div>

  <script>
    const history = [];   // Gemini에 보낼 대화 기록
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");
    const sendBtn = document.querySelector("#form button");

    addBubble("안녕하세요! 제주 특산물을 알아보는 에이전트예요 🍊 무엇이 궁금하세요?", "agent");

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg || sendBtn.disabled) return;
      addBubble(msg, "me");
      history.push({ role: "user", text: msg });
      input.value = "";
      sendBtn.disabled = true;

      const wait = document.createElement("div");
      wait.className = "bubble agent";
      wait.textContent = "답변 작성 중...";
      chat.appendChild(wait);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "오류 " + res.status);
        wait.remove();
        addBubble(data.reply, "agent");
        history.push({ role: "model", text: data.reply });
      } catch (err) {
        wait.remove();
        history.pop();   // 실패한 질문은 기록에서 제외
        addBubble("⚠️ " + err.message, "agent");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
