<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 특산물 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Malgun Gothic", sans-serif;
    background: #fff8ee;
  }
  header {
    background: #ff9f1c;
    color: #fff;
    text-align: center;
    padding: 0.9rem;
    font-weight: bold;
    font-size: 1.1rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .bubble {
    max-width: 75%;
    padding: 0.6rem 0.9rem;
    border-radius: 16px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .me { align-self: flex-end; background: #2f7d4f; color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #fff; color: #2d2a26; border: 1px solid #f0dcc0; border-bottom-left-radius: 4px; }
  form {
    display: flex;
    gap: 0.5rem;
    padding: 0.7rem;
    background: #fff;
    border-top: 1px solid #eadfcf;
  }
  input { flex: 1; padding: 0.7rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 999px; outline: none; }
  button { padding: 0.7rem 1.3rem; font-size: 1rem; border: 0; border-radius: 999px; background: #2f7d4f; color: #fff; cursor: pointer; }
  .note { text-align: center; font-size: 0.75rem; color: #9a8f82; padding: 0.3rem 0 0.5rem; background: #fff; }
</style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button>보내기</button>
  </form>
  <div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요.</div>

  <script>
    const replies = [
      "안녕하세요! 제주 특산물을 알아보는 에이전트예요 🍊 감귤, 흑돼지, 갈치 중 어떤 게 궁금하세요?",
      "겨울이라면 노지 감귤을 추천해요! 달콤하고 비타민도 풍부해서 간식으로 딱이에요 🍊",
      "아직 공부 중이에요! 5일차에 진짜로 알아볼게요."
    ];
    let turn = 0;
    const chat = document.getElementById("chat");
    const input = document.getElementById("text");

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("form").addEventListener("submit", e => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      addBubble(msg, "me");
      input.value = "";
      const reply = replies[turn % replies.length];
      turn++;
      setTimeout(() => addBubble(reply, "agent"), 1000);
    });
  </script>
</body>
</html>
